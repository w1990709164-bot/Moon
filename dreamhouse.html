<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>梦男之家</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0d0d1a;color:#e2e2f0;font-family:'Noto Sans SC',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 10% 0%,rgba(109,40,217,.22),transparent 42%),#0d0d1a}
.top{background:#12122a;padding:42px 14px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.05)}
.back{background:none;border:0;color:#c084fc;font-size:22px;line-height:1;padding:4px 8px;cursor:pointer}
.title{flex:1;text-align:center;font-weight:800;font-size:19px;color:#fff;letter-spacing:1px}.profile{color:#c084fc;font-size:13px;padding:6px 4px;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:6px;background:#12122a;padding:0 8px 8px;flex-shrink:0}.tab{flex:1;text-align:center;padding:8px 5px;border-radius:20px;color:#666688;font-size:13px;cursor:pointer}.tab.on{background:#1e1e3f;color:#c084fc;font-weight:700}
.actions{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#0d0d1a;flex-shrink:0}.btn{border:0;border-radius:20px;color:#fff;font-family:inherit;cursor:pointer;font-size:14px;padding:10px 14px}.btn.purple{background:#6d28d9}.btn.pink{background:#be185d}.btn.gray{background:#252540;color:#a3a3c2}.btn:disabled{opacity:.5}
.list{flex:1;overflow-y:auto;padding:12px 14px 22px}.list::-webkit-scrollbar{display:none}
.post{background:#12122a;border:1px solid rgba(192,132,252,.12);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 22px rgba(0,0,0,.18);cursor:pointer}.post:active{transform:scale(.99)}
.post-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.alias{color:#c084fc;font-size:13px;font-weight:700;flex:1}.board{font-size:10px;color:#818cf8;background:#1e1e3f;border-radius:9px;padding:2px 8px}.time{font-size:10px;color:#555577}.content{font-size:14px;line-height:1.8;color:#e2e2f0;white-space:pre-wrap;word-break:break-word}.thumb{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin:8px 0 10px;background:#080812}.meta{display:flex;gap:16px;margin-top:10px;color:#8888aa;font-size:12px}.empty{text-align:center;color:#555577;padding:70px 20px;line-height:2}.empty .e{font-size:46px;margin-bottom:12px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:18px}.mask.show{display:flex}.dialog{width:100%;max-width:350px;background:#12122a;border:1px solid rgba(192,132,252,.22);border-radius:18px;padding:18px}.dialog-title{font-size:17px;font-weight:800;color:#fff;margin-bottom:10px}.dialog-body{font-size:13px;color:#a3a3c2;line-height:1.8;max-height:68vh;overflow-y:auto}.dialog-actions{display:flex;gap:10px;margin-top:16px}.dialog-actions .btn{flex:1}.field{margin:10px 0}.label{font-size:12px;color:#8888aa;margin-bottom:5px}.input,.textarea{width:100%;background:#0d0d1a;border:1px solid #252540;border-radius:12px;padding:10px 12px;color:#e2e2f0;font-family:inherit;outline:none}.textarea{min-height:110px;resize:vertical;line-height:1.6}.toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:rgba(20,20,38,.94);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;z-index:99;white-space:nowrap}.toast.show{opacity:1}
.comments{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}.comment-title{text-align:center;color:#555577;font-size:11px;margin-bottom:6px}.comment{font-size:12.5px;line-height:1.7;margin:5px 0}.comment.support{color:#a3a3c2}.comment.argue{color:#f87171}.comment.jealous{color:#f472b6}.comment.echo{color:#60a5fa}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="back" onclick="location.href='index.html'">←</button><div class="title">✦ 梦男之家 ✦</div><div class="profile" onclick="openProfile()">我的档案</div></div>
  <div class="tabs" id="tabs"></div>
  <div class="actions"><button class="btn purple" id="btnText" onclick="triggerAiCreation()">✦ 召唤创作</button><button class="btn pink" id="btnImg" onclick="triggerFanArt()">🎨 生同人图</button><button class="btn gray" onclick="clearBoard()">清屏</button></div>
  <div class="list" id="list"></div>
</div>

<div class="mask" id="detailMask" onclick="closeDetail(event)"><div class="dialog" onclick="event.stopPropagation()"><div class="dialog-title" id="detailTitle"></div><div class="dialog-body" id="detailBody"></div><div class="dialog-actions"><button class="btn gray" onclick="hideDetail()">关闭</button></div></div></div>
<div class="mask" id="profileMask" onclick="closeProfile(event)"><div class="dialog" onclick="event.stopPropagation()"><div class="dialog-title">我的档案</div><div class="dialog-body"><div class="field"><div class="label">外形描述（用于同人图/同人文）</div><textarea class="textarea" id="appearanceInput" placeholder="例如：黑发，冷白皮，喜欢黑色衣服……"></textarea></div><div class="field"><div class="label">偏好补充</div><textarea class="textarea" id="prefInput" placeholder="想让梦男之家围绕你写什么氛围、关系、禁忌等"></textarea></div></div><div class="dialog-actions"><button class="btn gray" onclick="hideProfile()">取消</button><button class="btn purple" onclick="saveProfile()">保存</button></div></div></div>
<div class="mask" id="gateMask"><div class="dialog"><div class="dialog-title">🔞 深渊入口</div><div class="dialog-body">深渊板块包含成人向内容。请确认你已满18岁且自愿进入。</div><div class="dialog-actions"><button class="btn gray" onclick="hideGate()">离开</button><button class="btn pink" onclick="unlockAbyss()">我已满18岁</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const boards=['同人文','同人图','交流','深渊'];let currentBoard='同人文',abyss=false,posts=[];
const aliases={p:['星尘','月影','深海','暗夜','迷雾','晨曦','流光','暮色','烟雨','霜降'],s:['的梦','过客','漫游者','观察员','低语者','守望者','追光者','迷途者']};
function jget(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}function jset(k,v){localStorage.setItem(k,JSON.stringify(v))}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2400)}
function fmt(ts){const d=new Date(ts);return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function aliasFor(id){let a=jget('dreamAliases',{});if(!a[id]){a[id]=aliases.p[Math.floor(Math.random()*aliases.p.length)]+aliases.s[Math.floor(Math.random()*aliases.s.length)];jset('dreamAliases',a)}return a[id]}
function init(){renderTabs();posts=jget('dreamPosts',[]);render()}function renderTabs(){document.getElementById('tabs').innerHTML=boards.map(b=>`<div class="tab ${b===currentBoard?'on':''}" onclick="setBoard('${b}')">${b==='深渊'?'🔞 深渊':b}</div>`).join('')}function setBoard(b){if(b==='深渊'&&!abyss){document.getElementById('gateMask').classList.add('show');return}currentBoard=b;renderTabs();render()}function hideGate(){document.getElementById('gateMask').classList.remove('show')}function unlockAbyss(){abyss=true;hideGate();setBoard('深渊')}
function render(){const list=document.getElementById('list');let arr=posts.filter(p=>p.boardId===currentBoard&&(currentBoard==='深渊'?p.grade>=1:p.grade===0)).sort((a,b)=>b.timestamp-a.timestamp);if(!arr.length){list.innerHTML='<div class="empty"><div class="e">✦</div>暂无内容<br>点击「召唤创作」让角色们发布新内容</div>';return}list.innerHTML=arr.map(p=>`<div class="post" onclick="showPost(${p.id})"><div class="post-head"><div class="alias">✦ ${esc(p.authorAlias)}</div><div class="board">${esc(p.boardId)}</div><div class="time">${fmt(p.timestamp)}</div></div>${p.imagePath?`<img class="thumb" src="${p.imagePath}" onerror="this.style.display='none'">`:''}<div class="content">${esc((p.content||'').slice(0,180))}${(p.content||'').length>180?'…':''}</div><div class="meta"><span>♡ ${p.likeCount||0}</span><span>✦ ${p.collectCount||0}</span><span>评论 ${p.reactions?.length||0}</span></div></div>`).join('')}
function showPost(id){const p=posts.find(x=>x.id===id);if(!p)return;document.getElementById('detailTitle').textContent='✦ '+p.authorAlias;let html=(p.imagePath?`<img class="thumb" src="${p.imagePath}">`:'')+`<div class="content">${esc(p.content)}</div>`;if(p.reactions&&p.reactions.length){html+=`<div class="comments"><div class="comment-title">── 评论区 ──</div>`+p.reactions.map(r=>`<div class="comment ${r.cls}">${esc(r.alias)}：${esc(r.content)}</div>`).join('')+'</div>'}document.getElementById('detailBody').innerHTML=html;document.getElementById('detailMask').classList.add('show')}function closeDetail(e){if(e.target.id==='detailMask')hideDetail()}function hideDetail(){document.getElementById('detailMask').classList.remove('show')}
function profile(){return jget('dreamProfile',{appearance:'',pref:''})}function openProfile(){const p=profile();document.getElementById('appearanceInput').value=p.appearance||'';document.getElementById('prefInput').value=p.pref||'';document.getElementById('profileMask').classList.add('show')}function closeProfile(e){if(e.target.id==='profileMask')hideProfile()}function hideProfile(){document.getElementById('profileMask').classList.remove('show')}function saveProfile(){jset('dreamProfile',{appearance:document.getElementById('appearanceInput').value.trim(),pref:document.getElementById('prefInput').value.trim()});hideProfile();toast('已保存档案')}
function getApi(){return jget('api',{})}function chatUrl(){let u=(getApi().url||'').trim().replace(/\/$/,'');if(!u)return'';return u.endsWith('/chat/completions')?u:u+(u.includes('/v1')?'/chat/completions':'/v1/chat/completions')}function imgUrl(){let u=(getApi().imgUrl||'').trim().replace(/\/$/,'');if(!u)return'';return u.endsWith('/images/generations')?u:u+(u.includes('/v1')?'/images/generations':'/v1/images/generations')}
async function callChat(prompt,max=900){const api=getApi(),url=chatUrl();if(!url||!api.key)throw new Error('请先在小手机设置里填写聊天 API');const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+api.key},body:JSON.stringify({model:api.model,messages:[{role:'user',content:prompt}],temperature:.9,max_tokens:max})});const d=await r.json();if(!r.ok||d.error)throw new Error(d.error?.message||'创作失败');return(d.choices?.[0]?.message?.content||'').trim()}
async function callImg(prompt){const api=getApi(),url=imgUrl();if(!url||!api.imgKey)throw new Error('请先在小手机设置里填写生图 API');const final=[prompt,api.imgPositive||''].filter(Boolean).join(', ');const body={model:api.imgModel||undefined,prompt:final,negative_prompt:api.imgNegative||undefined,size:api.imgSize||'512x512',n:1,response_format:'url'};Object.keys(body).forEach(k=>body[k]===undefined&&delete body[k]);const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+api.imgKey},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error?.message||'生图失败');const item=d.data?.[0]||d.images?.[0]||d.output?.[0]||d;return item.url||item.image_url||(item.b64_json?'data:image/png;base64,'+item.b64_json:'')}
function randomAuthor(){const cs=jget('chars',[]);if(cs.length&&Math.random()>.45){const c=cs[Math.floor(Math.random()*cs.length)];return{id:c.id,alias:aliasFor(c.id),persona:c.system||c.identity||c.relation||'一个有个性的角色'}}return{id:'npc_'+Date.now(),alias:aliasFor('npc_'+Math.random()),persona:'一个对主角有好感的匿名创作者'}}
function buildTextPrompt(board,author){const p=profile();const appearance=p.appearance?`主角外形：${p.appearance}`:'主角是被所有人关注和迷恋的中心';const pref=p.pref?`用户偏好：${p.pref}`:'';if(board==='交流')return`你是匿名网友，人设：${author.persona}\n${appearance}\n${pref}\n请发一条关于主角的讨论帖，100-200字，核心永远围绕主角，直接输出正文。`;if(board==='深渊')return`你是匿名成人向同人作者，人设：${author.persona}\n${appearance}\n${pref}\n请创作一篇成人向、情绪张力强的第一人称同人短文，400-600字。主角是被爱与被渴望的中心，必须是自愿、平等、成年人之间的亲密关系。直接输出正文，不要标题。`;return`你是匿名同人作者，人设：${author.persona}\n${appearance}\n${pref}\n请以第一人称写一篇关于你和主角的短篇同人文，300-500字。主角是被爱的中心，文风含蓄、克制、有氛围，直接输出正文，不要标题。`}
function genReactions(content){const names=['星河漫游者','月影观察员','深海低语者','暮色守望者'];const types=[['support','这段真的写出了主角的感觉。'],['argue','我觉得这里有点OOC，主角不会这么轻易软化。'],['jealous','不许你比我更懂ta，我也见过ta这样。'],['echo','看到这里有点破防，主角就是有这种魔力。']];return types.map((t,i)=>({alias:names[i],cls:t[0],content:t[1]}))}
async function triggerAiCreation(){const btn=document.getElementById('btnText');btn.disabled=true;btn.textContent='召唤中…';try{const a=randomAuthor();const content=await callChat(buildTextPrompt(currentBoard,a),1300);const grade=currentBoard==='深渊'?1:0;posts.unshift({id:Date.now(),authorId:a.id,authorAlias:a.alias,boardId:currentBoard,content,imagePath:'',grade,likeCount:Math.floor(Math.random()*280)+8,collectCount:Math.floor(Math.random()*80)+2,timestamp:Date.now(),reactions:genReactions(content)});jset('dreamPosts',posts);toast('✦ '+a.alias+' 发布了新内容');render()}catch(e){toast(e.message||'创作失败')}finally{btn.disabled=false;btn.textContent='✦ 召唤创作'}}
async function triggerFanArt(){const p=profile();if(!p.appearance){toast('请先在「我的档案」填写外形描述');openProfile();return}const api=getApi();if(!api.imgEnable){toast('请先在小手机设置里开启角色生图');return}const btn=document.getElementById('btnImg');btn.disabled=true;btn.textContent='生成中…';try{const a=randomAuthor();const stylePrompt=`You are ${a.persona}. Create one English image prompt for fan art of the protagonist. Protagonist appearance: ${p.appearance}. Preference: ${p.pref||'romantic, atmospheric'}. Board: ${currentBoard}. ${currentBoard==='深渊'?'Adult intimate but consensual mood, sensual composition.':'Illustration, emotional atmosphere.'} Only output prompt.`;const prompt=await callChat(stylePrompt,180);const img=await callImg(prompt);if(!img)throw new Error('接口没有返回图片');const cap=await callChat(`你刚为主角画了一幅同人图。画面prompt：${prompt}\n请写50字以内发帖配文，含蓄有情感，直接输出。`,150).catch(()=> '画完以后，屏幕暗下去，我还是看了很久。');const grade=currentBoard==='深渊'?1:0;const board=currentBoard==='深渊'?'深渊':'同人图';posts.unshift({id:Date.now(),authorId:a.id,authorAlias:a.alias,boardId:board,content:cap,imagePath:img,grade,likeCount:Math.floor(Math.random()*280)+8,collectCount:Math.floor(Math.random()*80)+2,timestamp:Date.now(),reactions:genReactions(cap)});jset('dreamPosts',posts);if(currentBoard!==board)setBoard(board);else render();toast('🎨 '+a.alias+' 画了一幅同人图')}catch(e){toast(e.message||'生图失败')}finally{btn.disabled=false;btn.textContent='🎨 生同人图'}}
function clearBoard(){if(confirm('清除当前板块本地内容？')){posts=posts.filter(p=>p.boardId!==currentBoard);jset('dreamPosts',posts);render()}}
init();
</script>
</body>
</html>
